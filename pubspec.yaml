name: acelerometro_ejemplo
description: "App de ejemplo para el video sobre acelerómetro y giroscopio en Flutter con sensors_plus (Android, iOS y Web)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Lee acelerómetro, acelerómetro de usuario y giroscopio en Android, iOS y Web.
  sensors_plus: ^7.1.0
  # APIs del navegador (permisos y 'devicemotion' para Safari). Solo se usa en Web.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Imágenes del muñequito (tranquilo y despeinado).
  assets:
    - assets/
